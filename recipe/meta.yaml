{% set name = "elfutils" %}
{% set version = "0.197" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://sourceware.org/ftp/elfutils/{{ version }}/{{ name }}-{{ version }}.tar.bz2
  sha256: 1fdf525f22dcf796d99a99ba3ea00a1f7b1ae5421bc62e8443a708920b99b904

build:
  number: 0
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage('elfutils', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - pkg-config
    - make
    - m4
  host:
    - libmicrohttpd
    - bzip2 {{ bzip2 }}
    - libarchive {{ libarchive }}
    - libcurl {{ libcurl }}
    - sqlite {{ sqlite }}
    - xz {{ xz }}
    - zlib {{ zlib }}
    - zstd {{ zstd }}

test:
  requires:
    - {{ compiler('c') }}
    - pkg-config

about:
  home: https://sourceware.org/elfutils/
  dev_url: https://sourceware.org/git/?p=elfutils.git;a=tree;h=refs/tags/elfutils-{{ version }};hb=refs/tags/elfutils-{{ version }}
  doc_url: https://sourceware.org/git/?p=elfutils.git;a=tree;f=doc;hb=refs/tags/elfutils-{{ version }}
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: COPYING-LGPLV3
  summary: A set of utilities and libraries for handling ELF (Executable and Linkable Format) files.
  description: |
    A set of utilities and libraries for handling ELF (Executable and Linkable
    Format) files.  This includes libelf, libdw, libasm, libdwelf, libdwfl and
    libebl together with the eu-* command line tools.

extra:
  recipe-maintainers:
    - edisongustavo
    - xhochy
